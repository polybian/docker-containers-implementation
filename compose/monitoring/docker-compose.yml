# Demo stack: mini monitoring -- Prometheus + Grafana.
# Run on a Docker host:  cp .env.example .env   # then fill in Grafana creds
#                        docker compose up -d
name: demo-monitoring

services:
  prometheus:
    # Pinned. Check https://prometheus.io/download/ before bumping.
    image: prom/prometheus:v2.55.1
    container_name: demo-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    volumes:
      # Config mounted read-only: a compromised prometheus can't rewrite its
      # own scrape targets.
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      # Loopback-only, same reasoning as the app-db stack.
      - "127.0.0.1:9090:9090"
    networks:
      - monnet
    restart: unless-stopped

  grafana:
    # Pinned. Grafana publishes a changelog worth reading before upgrades.
    image: grafana/grafana:11.4.0
    container_name: demo-grafana
    env_file:
      - .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # This is a demo environment, not the internet: no public sign-ups.
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    networks:
      - monnet
    restart: unless-stopped

networks:
  monnet:
    driver: bridge

volumes:
  promdata:
  grafanadata:
