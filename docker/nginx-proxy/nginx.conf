# Reverse proxy config for the hardened nginx image.
# Upstream `app` resolves via Docker's embedded DNS on the compose network
# (see docs/networking.md) -- no hardcoded IPs.

upstream demo_app {
    server app:8000 max_fails=3 fail_timeout=30s;
}

server {
    # The unprivileged nginx image cannot bind port 80 (needs root), so we
    # listen on 8080 and the compose file maps the host port.
    listen 8080;

    # Don't advertise the exact nginx version in the Server header.
    server_tokens off;

    # Liveness probe target for the Dockerfile HEALTHCHECK below.
    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location / {
        proxy_pass http://demo_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # If web content is ever mounted here, never serve dotfiles (.git, .env).
    location ~ /\. {
        deny all;
        access_log off;
    }
}
